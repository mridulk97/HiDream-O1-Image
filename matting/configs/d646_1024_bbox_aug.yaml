# D-646 with bbox conditioning AND composite augmentation.
#
# The point of the augmentation is to make the box mean something. Unaugmented,
# the box covers a median 0.69 of the frame (35% of samples over 0.80), so it
# barely localizes -- and with one foreground per image it never selects either,
# so the model can score perfectly while ignoring it entirely.
#
#   aug_scale        shrinks the subject and places it randomly. Measured: box
#                    area median 0.66 -> 0.15, so the box now localizes.
#   aug_distractors  pastes other foregrounds into the background while the
#                    ground truth stays the target's alpha alone. This is the
#                    only setting where the box is load-bearing: with several
#                    plausible objects present, it is the sole cue for which to
#                    matte. probe_box_wiring.py is only meaningful with this on.
#
# D-646 only -- AM-2k ships finished photographs, not foreground/background
# sources, so there is nothing to recomposite.
#
# The box is rendered as a layout image and appended as a SECOND reference
# image; HiDream has no other bbox mechanism (models/utils.py:161). RoPE places
# it in the next offset block on its own -- nothing to configure.
#
# Both datasets have one foreground per image, so the box localizes rather than
# selects, and is redundant on every training sample. That makes
# matting/probe_box_wiring.py the number to watch: if the box gap is under 10%
# the model is ignoring the box and this config is doing nothing.

resolution: 1024
overfit_samples: 0
prompt: "Transform to matting map while maintaining original composition"

datasets: [d646]
dataset_weights: [1]

aug_scale: [0.5, 0.75]
aug_distractors: 2
# Half the samples keep the original full-frame composite, so the unaugmented
# distribution stays represented rather than being replaced.
aug_prob: 0.5
aug_seed: 2025

use_bbox: true
# Per-edge random expand/shrink. Not cosmetic: a pixel-exact box invites the
# degenerate solution `alpha = box interior`, which scores well on single-object
# data and is useless on anything real.
bbox_jitter: 0.05
# Only this fraction of samples get jittered; the rest see the exact box. The
# jitter expands outward only, so a jittered box still contains the subject --
# the point is that the model cannot assume the box is tight, not that the box
# should ever be wrong.
bbox_jitter_prob: 0.2
# The layout image is a rectangle outline on black, so it needs far less
# resolution than the photo: 256 tokens against the photo's 1024. The target and
# the photo both stay at 1024.
bbox_resolution: 512

lora_rank: 16
lora_alpha: 16
gradient_checkpointing: true

timestep_type: uniform
shift: 4.0
sigma_min: 0.05
cfg_dropout: 0.1

lr: 8.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
batch_size: 4
grad_accum: 4          # effective batch 16
max_steps: 20000
seed: 42

preview_every: 50
wandb_num_examples: 4
preview_fixed_samples: 4
wandb_sampling_steps: 28
wandb_guidance: 1.0

log_every: 10
val_every: 0
val_samples: 4
save_every: 500
